  // ------------------------------------------------------------------ Asistente de postulación
  function asistente(p) {
    var P = p; // estado local
    var paso = 0, sucio = false, guardando = false, ultimoGuardado = null;
    var esP = p.tipo === 'protocolo';
    var PASOS = esP ? ['w_info', 'w_invest', 'w_protocolo', 'w_medios', 'w_docs', 'w_envio'] : ['w_datos', 'w_autores', 'w_manuscrito', 'w_medios', 'w_docs', 'w_envio'];
    var MAX = S.max;
    if (esP) {
      if (!P.protocolo || Array.isArray(P.protocolo)) P.protocolo = {};
      P.protocolo = Object.assign({ grupo: '', idioma: 'es', resumen_es: '', pregunta: '', fecha_inicio: '', fecha_fin: '', fuentes: [], riesgo_etico: '', consentimiento: '' }, P.protocolo);
      if (!P.protocolo.fuentes.length) P.protocolo.fuentes.push({ fuente: '', valor: 0 });
    }
    function lim(s) { var T = S.tipos[P.tipo]; return (T.limites && T.limites[s]) || MAX; }
    function opc(s) { var T = S.tipos[P.tipo]; return T.opcionales && T.opcionales.indexOf(s) >= 0; }
    function chkKeys() { return esP ? S.checklistProt : S.checklist; }
    function chkTxt(k) { return esP ? K.checklistProtocolo[S.lang][k] : K.checklist[S.lang][k]; }
    function totalFin() { return (P.protocolo.fuentes || []).reduce(function (a, f) { return a + (+f.valor || 0); }, 0); }
    function pesos(n) { return '$ ' + Math.round(+n || 0).toLocaleString('es-CO'); }
    var reenvio = p.estado === 'ajustes';
    var msgs = p.eventos.filter(function (e) { return e.actor === 'admin' && e.mensaje; });

    $('#pc').innerHTML = '<p><a href="#/panel">' + esc(t('volver')) + '</a></p>' +
      (reenvio ? '<div class="alerta aviso"><b>' + esc(t('ajustes_banner')) + '</b>' + (msgs.length ? '<div style="white-space:pre-wrap;margin-top:8px;color:var(--tinta)">' + esc(msgs[msgs.length - 1].mensaje) + '</div>' : '') + '</div>' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px"><h2 style="margin:0" id="w-tit"></h2><span>' + estadoBadge(p.estado) + ' <span class="codigo">' + esc(p.codigo) + (reenvio ? ' · ' + esc(t('version')) + ' ' + (p.version + 1) : '') + '</span></span></div>' +
      '<div class="asistente"><ol class="pasos-asis" id="w-pasos"></ol><div id="w-cuerpo"></div></div>';

    function datosGuardar() {
      return { id: P.id, tipo: P.tipo, titulo: P.titulo, resumen: P.resumen, palabras_clave: P.palabras_clave, nivel_evidencia: P.nivel_evidencia, tipo_estudio: P.tipo_estudio,
        coautores: P.coautores, secciones: P.secciones, checklist: P.checklist, comentarios_editor: P.comentarios_editor, respuesta_autor: P.respuesta_autor, protocolo: P.protocolo || {} };
    }
    function estadoGuardado(txt) { var g = $('#w-guardado'); if (g) g.textContent = txt; }
    function guardar() {
      if (!sucio || guardando) return Promise.resolve();
      guardando = true; sucio = false; estadoGuardado(t('guardando'));
      return C.api('propuesta_guardar', datosGuardar()).then(function () {
        ultimoGuardado = new Date(); estadoGuardado(t('guardado') + ' · ' + ultimoGuardado.toLocaleTimeString(EN() ? 'en-US' : 'es-CO', { hour: '2-digit', minute: '2-digit' }));
      }).catch(function (e) { sucio = true; estadoGuardado(t('sin_guardar')); if (e.message === 'sin_sesion') fallo(e); else C.aviso(terr(e), 'error'); })
        .then(function () { guardando = false; if (sucio) programar(); });
    }
    var programar = C.debounce(guardar, 1200);
    function cambio() { sucio = true; estadoGuardado(t('sin_guardar')); programar(); pintarPasos(); }
    S.autoguardar = function (ya) { if (ya && sucio) guardar(); };
    window.onbeforeunload = function () { if (sucio) { guardar(); return true; } };

    function faltantes() {
      var T = S.tipos[P.tipo], f = [];
      var a = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [] };
      if (!P.titulo.trim()) a[0].push(t('f_titulo')); else if (!esP && C.palabrasTitulo(P.titulo) > 12) a[0].push(t('f_titulo_largo'));
      if (esP) {
        var R = P.protocolo;
        if (!R.grupo.trim()) a[0].push(t('f_grupo'));
        if (!R.pregunta.trim()) a[0].push(t('f_pregunta'));
        if (!R.fecha_inicio || !R.fecha_fin || R.fecha_fin < R.fecha_inicio) a[0].push(t('f_fechas'));
        if (!R.fuentes.some(function (f) { return f.fuente.trim() && +f.valor > 0; })) a[0].push(t('f_fin'));
        if (R.idioma !== 'es' && !R.resumen_es.trim()) a[0].push(t('f_resumen_es'));
        if (!(S.autor.cv || {}).pregrado) a[1].push(t('f_cv'));
        if (!R.riesgo_etico) a[2].push(t('f_riesgo'));
        if (!R.consentimiento) a[2].push(t('f_consent'));
      }
      if (T.resumen) {
        if (!P.resumen.trim()) a[0].push(t('f_resumen')); else if (C.palabras(P.resumen) > T.resumen) a[0].push(t('f_resumen_largo') + ' (' + T.resumen + ')');
        if (P.palabras_clave.length < 3 || P.palabras_clave.length > 5) a[0].push(t('f_kw'));
      }
      if (['original', 'caso', 'revision', 'tecnica'].indexOf(P.tipo) >= 0 && !P.nivel_evidencia) a[0].push(t('f_nivel'));
      if (P.coautores.length + 1 > T.autores) a[1].push(t('f_autores'));
      if (P.coautores.some(function (c) { return !c.nombre.trim() || !c.afiliacion.trim(); })) a[1].push(t('f_coautor'));
      if (P.coautores.some(function (c) { return !C.orcidValido(c.orcid); })) a[1].push(t('f_coorcid'));
      if (!C.orcidValido(S.autor.orcid)) a[1].push(t('f_orcid'));
      if (C.esColombia(S.autor.pais) && !(S.autor.cv || {}).cvlac) a[1].push(t('f_cvlac'));
      T.secciones.forEach(function (s) { var tx = P.secciones[s] || ''; if (!tx.trim()) { if (!opc(s)) a[2].push(t('f_seccion') + ' «' + K.secciones[S.lang][s] + '»'); } else if (C.palabras(tx) > lim(s)) a[2].push(K.secciones[S.lang][s] + ': ' + t('f_seccion_larga')); });
      var cats = {}; P.archivos.forEach(function (x) { cats[x.categoria] = (cats[x.categoria] || 0) + 1; });
      docsReq(P.tipo).forEach(function (d) { if (!cats[d]) a[4].push(t('f_doc') + ' «' + K.documentos[S.lang][d][0] + '»'); });
      if (esP && cats.hoja_vida && cats.hoja_vida < P.coautores.length + 1) a[4].push(t('f_hojas'));
      if (chkKeys().some(function (k) { return !P.checklist[k]; })) a[5].push(t('f_chk'));
      if (reenvio && !String(P.respuesta_autor || '').trim()) a[5].push(t('f_resp'));
      return a;
    }
    function pintarPasos() {
      var fa = faltantes();
      $('#w-pasos').innerHTML = PASOS.map(function (k, i) {
        var ok = !fa[i].length && (i !== 3 || true);
        return '<li><button type="button" data-p="' + i + '"' + (i === paso ? ' aria-current="step"' : '') + ' class="' + (i === paso ? '' : ok ? 'ok' : 'falta') + '"><span class="n">' + (i === paso || !ok ? (i + 1) : '✓') + '</span><span class="t">' + esc(t(k)) + '</span></button></li>';
      }).join('') + '<li class="guardado" id="w-guardado">' + esc(ultimoGuardado ? t('guardado') + ' · ' + ultimoGuardado.toLocaleTimeString(EN() ? 'en-US' : 'es-CO', { hour: '2-digit', minute: '2-digit' }) : sucio ? t('sin_guardar') : t('guardado')) + '</li>';
      $$('#w-pasos button').forEach(function (b) { b.onclick = function () { ir(+b.dataset.p); }; });
      $('#w-tit').textContent = P.titulo || (EN() ? 'New proposal' : 'Nueva propuesta');
    }
    function ir(n) { guardar(); paso = n; pintarPasos(); pintar(); window.scrollTo({ top: $('#pc').offsetTop - 120, behavior: 'smooth' }); }
    function pie() {
      return '<div class="pie-asis"><div>' + (paso > 0 ? '<button class="btn btn-suave" data-nav="-1">' + esc(t('anterior')) + '</button>' : '') + '</div><div style="display:flex;gap:10px;flex-wrap:wrap">' +
        (P.estado === 'borrador' ? '<button class="btn-texto peligro" id="b-borrar">' + esc(t('eliminar_borrador')) + '</button>' : '') +
        '<button class="btn btn-suave" id="b-salir-w">' + esc(t('guardar_salir')) + '</button>' +
        (paso < PASOS.length - 1 ? '<button class="btn btn-azul" data-nav="1">' + esc(t('siguiente')) + '</button>' : '') + '</div></div>';
    }
    function enlazarPie(c) {
      $$('[data-nav]', c).forEach(function (b) { b.onclick = function () { ir(paso + (+b.dataset.nav)); }; });
      $('#b-salir-w', c).onclick = function () { guardar().then(function () { location.hash = '#/panel'; }); };
      var bb = $('#b-borrar', c);
      if (bb) bb.onclick = function () {
        C.confirmar(t('eliminar_borrador'), esc(t('borrar_conf')), t('si_eliminar'), t('cancelar'), true).then(function (si) {
          if (!si) return; sucio = false;
          C.api('propuesta_borrar', { id: P.id }).then(function () { S.autoguardar = null; location.hash = '#/panel'; }).catch(function (e) { C.aviso(terr(e), 'error'); });
        });
      };
    }

    // ---- control de texto con límite de palabras
    function areaTexto(id, etq, valor, max, ayuda, filas) {
      var n = C.palabras(valor);
      return '<div class="seccion-txt"><div class="cab"><label for="' + id + '">' + esc(etq) + '</label><span class="contador" id="' + id + '-c">' + n + ' / ' + max + ' ' + esc(t('palabras')) + '</span></div>' +
        (ayuda ? '<div class="ayuda" style="font-size:.88rem;color:var(--tinta-3);margin-bottom:6px">' + esc(ayuda) + '</div>' : '') +
        '<textarea id="' + id + '" rows="' + (filas || 10) + '" spellcheck="true">' + esc(valor) + '</textarea><div class="barra-palabras" id="' + id + '-b"><i></i></div></div>';
    }
    function limitar(id, max, alCambiar) {
      var ta = document.getElementById(id), cnt = document.getElementById(id + '-c'), bar = document.getElementById(id + '-b');
      var avisado = false;
      function act() {
        var n = C.palabras(ta.value);
        if (n > max) {
          var pos = ta.selectionStart;
          ta.value = C.recortar(ta.value, max); n = max;
          try { ta.setSelectionRange(Math.min(pos, ta.value.length), Math.min(pos, ta.value.length)); } catch (e) {}
          if (!avisado) { C.aviso(t('limite_alcanzado') + ' (' + t('limite_txt', { n: max }) + ')', 'error'); avisado = true; setTimeout(function () { avisado = false; }, 4000); }
        }
        cnt.textContent = n + ' / ' + max + ' ' + t('palabras');
        var r = n / max;
        cnt.className = 'contador' + (r >= 1 ? ' lleno' : r >= .9 ? ' cerca' : '');
        bar.className = 'barra-palabras' + (r >= 1 ? ' lleno' : r >= .9 ? ' cerca' : '');
        $('i', bar).style.width = Math.min(100, r * 100) + '%';
        alCambiar(ta.value);
      }
      ta.addEventListener('input', act);
      // Al llegar al límite, no deja escribir una palabra nueva
      ta.addEventListener('keydown', function (e) {
        if (C.palabras(ta.value) >= max && (e.key === ' ' || e.key === 'Enter') && ta.selectionStart === ta.selectionEnd) {
          var antes = ta.value.slice(0, ta.selectionStart);
          if (/\S$/.test(antes) && ta.selectionStart === ta.value.length) { e.preventDefault(); C.aviso(t('limite_alcanzado'), 'error'); }
        }
      });
      act();
      // primera llamada no es cambio real
    }

    function pintar() {
      var c = $('#w-cuerpo'), T = S.tipos[P.tipo];
      var h = '';
      if (esP && (paso <= 2 || paso === 4)) { pintarProtocolo(c, T); enlazarPie(c); return; }
      if (paso === 0) {
        var niveles = ['I', 'II', 'III', 'IV', 'V'];
        h = '<div class="tarjeta"><h3>' + esc(t('w_datos')) + '</h3><div class="campos">' +
          (reenvio ? '<div class="campo ancho"><label>' + esc(t('tipo_art')) + '</label><div><b>' + esc(tipoNom(P.tipo)) + '</b></div></div>'
            : campo('w-tipo', t('tipo_art'), '<select id="w-tipo">' + Object.keys(S.tipos).map(function (k) { return '<option value="' + k + '"' + (k === P.tipo ? ' selected' : '') + '>' + esc(tipoNom(k)) + '</option>'; }).join('') + '</select>', true, 'ancho')) +
          '<div class="campo ancho" data-c="w-titulo"><div style="display:flex;justify-content:space-between;gap:10px"><label for="w-titulo">' + esc(t('titulo')) + '<span class="req">*</span></label><span class="contador" id="w-titulo-c"></span></div>' +
          '<input id="w-titulo" type="text" maxlength="400" value="' + esc(P.titulo) + '"><span class="ayuda">' + esc(t('titulo_ayuda')) + '</span></div>' +
          (['carta', 'especial'].indexOf(P.tipo) < 0 ? campo('w-nivel', t('nivel'), '<select id="w-nivel"><option value="">' + esc(t('seleccione')) + '</option>' + niveles.map(function (n) { return '<option' + (n === P.nivel_evidencia ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>', ['original', 'caso', 'revision', 'tecnica'].indexOf(P.tipo) >= 0, '', esc(t('nivel_ayuda'))) +
            campo('w-estudio', t('tipo_estudio'), '<input id="w-estudio" type="text" maxlength="120" value="' + esc(P.tipo_estudio) + '" placeholder="' + (EN() ? 'E.g., Therapeutic – retrospective comparative study' : 'Ej.: Terapéutico – estudio comparativo retrospectivo') + '">', false) : '') +
          (T.resumen ? '<div class="campo ancho" data-c="w-kw"><label>' + esc(t('palabras_clave')) + '<span class="req">*</span></label><div class="kw" id="w-kw"></div><span class="ayuda">' + esc(t('kw_ayuda')) + ' <a href="https://meshb.nlm.nih.gov/search" target="_blank" rel="noopener">MeSH ↗</a></span></div>' : '') +
          '</div></div>' +
          (T.resumen ? '<div class="tarjeta">' + areaTexto('w-resumen', t('resumen') + ' *', P.resumen, T.resumen, (T.estructurado ? t('res_estruct') : t('res_libre')) + ' ' + t('resumen_ayuda'), 8) + '</div>' : '');
        c.innerHTML = h + pie();
        if ($('#w-tipo')) $('#w-tipo').onchange = function () {
          P.tipo = this.value;
          var Tn = S.tipos[P.tipo];
          Tn.secciones.forEach(function (s) { if (P.secciones[s] == null) P.secciones[s] = ''; });
          cambio(); pintar();
        };
        var ti = $('#w-titulo'), tc = $('#w-titulo-c');
        function ct() { var n = C.palabrasTitulo(ti.value); tc.textContent = n + ' ' + t('de12'); tc.className = 'contador' + (n > 12 ? ' lleno' : n >= 11 ? ' cerca' : ''); }
        ti.oninput = function () { P.titulo = ti.value; ct(); cambio(); }; ct();
        if ($('#w-nivel')) $('#w-nivel').onchange = function () { P.nivel_evidencia = this.value; cambio(); };
        if ($('#w-estudio')) $('#w-estudio').oninput = function () { P.tipo_estudio = this.value; cambio(); };
        if (T.resumen) {
          var primera = true;
          limitar('w-resumen', T.resumen, function (v) { if (primera) { primera = false; return; } P.resumen = v; cambio(); });
          pintarKw();
        }
      }
      if (paso === 1) {
        var a = S.autor;
        h = '<div class="tarjeta"><h3>' + esc(t('autor_principal')) + '</h3><p style="font-size:.92rem;color:var(--tinta-3)">' + esc(t('autor_principal_txt')) + '</p>' +
          '<div class="campos"><div class="campo"><label>' + esc(t('nombre')) + '</label><div><b>' + esc(a.nombre) + '</b></div></div><div class="campo"><label>' + esc(t('correo')) + '</label><div>' + esc(a.correo) + '</div></div>' +
          '<div class="campo"><label>' + esc(t('institucion')) + '</label><div>' + esc(a.institucion || '—') + '</div></div><div class="campo"><label>ORCID</label><div>' + esc(a.orcid || '—') + '</div></div></div></div>' +
          '<div class="tarjeta"><h3>' + esc(t('coautores')) + '</h3><p class="ayuda" style="font-size:.9rem;color:var(--tinta-3)">' + esc(t('max_autores', { n: T.autores })) + '</p><div id="w-coautores"></div>' +
          '<button class="btn btn-suave" id="b-coautor"' + (P.coautores.length + 1 >= T.autores ? ' disabled' : '') + '>' + esc(t('agregar_coautor')) + '</button></div>';
        c.innerHTML = h + pie();
        pintarCoautores();
        $('#b-coautor').onclick = function () { P.coautores.push({ nombre: '', afiliacion: '', correo: '', orcid: '', contribucion: '' }); cambio(); pintar(); var ins = $$('#w-coautores input'); if (ins.length) ins[ins.length - 5].focus(); };
      }
      if (paso === 2) {
        var tot = 0;
        h = '<div class="tarjeta"><h3>' + esc(t('w_manuscrito')) + '</h3><p>' + t('man_txt') + '</p><div class="alerta info" id="w-total"></div>' +
          T.secciones.map(function (s) { return areaTexto('w-s-' + s, K.secciones[S.lang][s], P.secciones[s] || '', MAX, K.ayudaSecciones[S.lang][s], s === 'referencias' ? 12 : 14); }).join('') + '</div>';
        c.innerHTML = h + pie();
        function total() {
          var n = 0; T.secciones.forEach(function (s) { if (s !== 'referencias') n += C.palabras(P.secciones[s]); });
          var el = $('#w-total'); el.className = 'alerta ' + (n > T.cuerpo ? 'aviso' : 'info');
          el.innerHTML = '<b>' + esc(t('cuerpo_total')) + ':</b> ' + n + ' ' + esc(t('palabras')) + ' · ' + T.cuerpo + ' ' + esc(t('limite_tipo')) + (T.refs ? ' · ' + esc(K.secciones[S.lang].referencias) + ': ' + (P.secciones.referencias ? P.secciones.referencias.split(/\n+/).filter(function (x) { return x.trim(); }).length : 0) + ' / ' + T.refs : '');
        }
        T.secciones.forEach(function (s) {
          var primera = true;
          limitar('w-s-' + s, MAX, function (v) { if (primera) { primera = false; return; } P.secciones[s] = v; total(); cambio(); });

        '<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Fecha</th><th>Categoría</th><th>Título</th><th>Estado</th><th>Boletín</th><th></th></tr></thead><tbody>' +
        (r.noticias.length ? r.noticias.map(function (n) {
          return '<tr><td style="white-space:nowrap">' + esc(f(n.fecha)) + '</td><td><span class="etiqueta etq-' + esc(n.categoria) + '">' + esc(CATS[n.categoria]) + '</span></td><td><b>' + esc(n.titulo_es) + '</b>' + (n.titulo_en ? '<div class="t2" style="color:var(--tinta-3);font-size:.82rem">EN: ' + esc(n.titulo_en) + '</div>' : '<div style="color:var(--ambar);font-size:.8rem">Falta el título en inglés</div>') + '</td>' +
            '<td>' + (+n.publicado ? 'Visible' : 'Oculta') + (+n.fijado ? ' · 📌 Fijada' : '') + '</td><td style="font-size:.85rem">' + (n.enviado_en ? 'Enviado ' + esc(f(n.enviado_en)) + ' a ' + n.enviados : '—') + '</td>' +
            '<td style="white-space:nowrap"><button class="btn-texto" data-ed="' + n.id + '">Editar</button><button class="btn-texto" data-env="' + n.id + '">Enviar a suscritos</button><button class="btn-texto peligro" data-del="' + n.id + '">Borrar</button></td></tr>';
        }).join('') : '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--tinta-3)">Aún no hay entradas.</td></tr>') + '</tbody></table></div>');
      $('#b-nueva').onclick = function () { editarNoticia(null, r.publicadas); };
      $$('[data-ed]').forEach(function (b) { b.onclick = function () { editarNoticia(r.noticias.filter(function (n) { return n.id == b.dataset.ed; })[0], r.publicadas); }; });
      $$('[data-del]').forEach(function (b) { b.onclick = function () { C.confirmar('Borrar entrada', '¿Borrar esta entrada de Actualidad?', 'Borrar', 'Cancelar', true).then(function (si) { if (si) C.api('adm_actualidad_borrar', { id: +b.dataset.del }).then(vActualidad).catch(fallo); }); }; });
      $$('[data-env]').forEach(function (b) {
        b.onclick = function () {
          C.confirmar('Enviar a suscritos', 'Se enviará esta entrada por correo a todos los investigadores que aceptaron recibir notificaciones sobre nuevas publicaciones y anuncios.', 'Enviar', 'Cancelar').then(function (si) {
            if (si) C.api('adm_actualidad_enviar', { id: +b.dataset.env }).then(function (x) { C.aviso('Enviado a ' + x.enviados + ' de ' + x.total + ' suscritos.', 'exito'); vActualidad(); }).catch(fallo);
          });
        };
      });
    }).catch(fallo);
  }
  function editarNoticia(n, publicadas) {
    n = n || { categoria: 'anuncio', titulo_es: '', titulo_en: '', cuerpo_es: '', cuerpo_en: '', fecha: new Date().toISOString().slice(0, 10), publicado: 1, fijado: 0, imagen_id: null, propuesta_id: null, enlace: '' };
    var img = n.imagen_id;
    C.modal(n.id ? 'Editar entrada' : 'Nueva entrada de Actualidad',
      '<div class="campos"><div class="campo"><label>Categoría</label><select id="n-cat">' + Object.keys(CATS).map(function (k) { return '<option value="' + k + '"' + (k === n.categoria ? ' selected' : '') + '>' + CATS[k] + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>Fecha</label><input type="date" id="n-fecha" value="' + esc(n.fecha) + '"></div>' +
      '<div class="campo ancho"><label>Título (español) *</label><input id="n-tes" value="' + esc(n.titulo_es) + '" maxlength="250"></div><div class="campo ancho"><label>Título (inglés)</label><input id="n-ten" value="' + esc(n.titulo_en) + '" maxlength="250"></div>' +
      '<div class="campo ancho"><label>Texto (español)</label><textarea id="n-ces" rows="5">' + esc(n.cuerpo_es) + '</textarea></div><div class="campo ancho"><label>Texto (inglés)</label><textarea id="n-cen" rows="5">' + esc(n.cuerpo_en) + '</textarea></div>' +
      '<div class="campo"><label>Publicación vinculada</label><select id="n-pub"><option value="">Ninguna</option>' + publicadas.map(function (p) { return '<option value="' + p.id + '"' + (+p.id === +n.propuesta_id ? ' selected' : '') + '>' + esc(p.codigo + ' · ' + p.titulo.slice(0, 60)) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>Enlace externo</label><input id="n-enl" value="' + esc(n.enlace) + '" placeholder="https://"></div>' +
      '<div class="campo ancho"><label>Imagen</label><div style="display:flex;gap:12px;align-items:center"><img id="n-img" src="' + (img ? 'api.php?a=ver&id=' + img : '') + '" style="width:120px;height:68px;object-fit:cover;border-radius:4px;background:var(--crema)' + (img ? '' : ';display:none') + '" alt=""><input type="file" id="n-file" accept="image/jpeg,image/png,image/webp"><button type="button" class="btn-texto peligro" id="n-qimg">Quitar</button></div></div>' +
      '<label class="interruptor"><input type="checkbox" id="n-vis"' + (+n.publicado ? ' checked' : '') + '> Visible en el portal</label><label class="interruptor"><input type="checkbox" id="n-fij"' + (+n.fijado ? ' checked' : '') + '> Fijar arriba (destacada)</label></div>',
      [{ txt: 'Cancelar', valor: false }, { txt: 'Guardar', clase: 'btn-oro', accion: function (v, cerrar) {
        var d = { id: n.id || 0, categoria: $('#n-cat', v).value, fecha: $('#n-fecha', v).value, titulo_es: $('#n-tes', v).value, titulo_en: $('#n-ten', v).value, cuerpo_es: $('#n-ces', v).value, cuerpo_en: $('#n-cen', v).value,
          propuesta_id: $('#n-pub', v).value || null, enlace: $('#n-enl', v).value, imagen_id: img || null, publicado: $('#n-vis', v).checked, fijado: $('#n-fij', v).checked };
        C.api('adm_actualidad_guardar', d).then(function () { cerrar(true); vActualidad(); C.aviso('Entrada guardada.', 'exito'); }).catch(function (e) { C.aviso(err(e), 'error'); });
        return false;
      } }], true);
    setTimeout(function () {
      $('#n-file').onchange = function () {
        var fl = this.files[0]; if (!fl) return;
        var fd = new FormData(); fd.append('imagen', fl);
        C.api('adm_imagen', fd).then(function (x) { img = x.id; var i = $('#n-img'); i.src = 'api.php?a=ver&id=' + x.id; i.style.display = ''; }).catch(function (e) { C.aviso(err(e), 'error'); });
      };
      $('#n-qimg').onclick = function () { img = null; $('#n-img').style.display = 'none'; $('#n-file').value = ''; };
    }, 20);
  }

  // ------------------------------------------------------------------ Mensajes, bitácora, correos
  function vMensajes() {
    cargando();
    C.api('adm_contactos').then(function (r) {
      M('<h1>Mensajes del formulario de contacto</h1><p class="sub-t">También llegan al correo de investigación.</p>' + (r.contactos.length ? r.contactos.map(function (c) {
        return '<div class="tarjeta"' + (+c.leido ? ' style="opacity:.7"' : ' style="border-left:4px solid var(--oro)"') + '><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>' + esc(c.nombre) + ' &lt;<a href="mailto:' + esc(c.correo) + '?subject=' + encodeURIComponent('Re: ' + (c.asunto || '')) + '">' + esc(c.correo) + '</a>&gt;</b><span class="codigo">' + esc(f(c.creado_en, true)) + '</span></div>' +
          (c.asunto ? '<div style="font-weight:600;color:var(--azul);margin-top:4px">' + esc(c.asunto) + '</div>' : '') + '<div style="white-space:pre-wrap;margin-top:8px">' + esc(c.mensaje) + '</div>' + (+c.leido ? '' : '<p style="margin:10px 0 0"><button class="btn-texto" data-leido="' + c.id + '">Marcar como leído</button></p>') + '</div>';
      }).join('') : '<div class="vacio">No hay mensajes.</div>'));
      $$('[data-leido]').forEach(function (b) { b.onclick = function () { C.api('adm_contacto_leido', { id: +b.dataset.leido }).then(vMensajes); }; });
    }).catch(fallo);
  }
  function vBitacora() {
    cargando();
    C.api('adm_bitacora').then(function (r) {
      var L = r.bitacora;
      M('<h1>Bitácora</h1><p class="sub-t">Registro inalterable de todas las acciones en la plataforma (autores y administración).</p>' +
        '<div class="barra-herr"><input type="search" id="q" placeholder="Filtrar por nombre, acción, código, IP…"><select id="fa"><option value="">Todos</option><option value="autor">Autores</option><option value="admin">Administración</option></select><span class="esp"></span><a class="btn btn-suave btn-chico" href="api.php?a=adm_exportar&que=bitacora">Exportar a Excel (CSV)</a></div>' +
        '<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Fecha y hora</th><th>Quién</th><th>Acción</th><th>Detalle</th><th>IP</th></tr></thead><tbody id="tb"></tbody></table></div>');
      function pintar() {
        var q = $('#q').value.toLowerCase(), fa = $('#fa').value;
        $('#tb').innerHTML = L.filter(function (x) { return (!fa || x.actor_tipo === fa) && (!q || [x.actor_nombre, x.accion, x.detalle, x.ip].join(' ').toLowerCase().indexOf(q) >= 0); }).slice(0, 800).map(function (x) {
          return '<tr><td style="white-space:nowrap">' + esc(f(x.momento, true)) + '</td><td>' + esc(x.actor_nombre || '') + '<div style="font-size:.78rem;color:var(--tinta-3)">' + (x.actor_tipo === 'admin' ? 'Administración' : 'Autor') + '</div></td><td>' + esc(x.accion.replace(/_/g, ' ')) + '</td><td>' + esc(x.detalle) + (x.propuesta_id ? ' <a href="#/p/' + x.propuesta_id + '">→</a>' : '') + '</td><td class="codigo">' + esc(x.ip) + '</td></tr>';
        }).join('');
      }
      $('#q').oninput = C.debounce(pintar, 150); $('#fa').onchange = pintar; pintar();
    }).catch(fallo);
  }
  function vCorreos() {
    cargando();
    C.api('adm_correos').then(function (r) {
      var MOT = { registro: 'Bienvenida', postulacion: 'Nueva postulación', acuse: 'Acuse al autor', estado: 'Cambio de estado', restablecer: 'Restablecer contraseña', boletin: 'Boletín', contacto: 'Contacto', prueba: 'Prueba' };
      M('<h1>Correos enviados</h1><p class="sub-t">Cada correo automático que la plataforma intentó enviar. «Falló» significa que el hosting rechazó el envío.</p>' +
        '<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Fecha</th><th>Para</th><th>Asunto</th><th>Motivo</th><th>Resultado</th></tr></thead><tbody>' +
        r.correos.map(function (c) { return '<tr><td style="white-space:nowrap">' + esc(f(c.momento, true)) + '</td><td>' + esc(c.para) + '</td><td>' + esc(c.asunto) + '</td><td>' + esc(MOT[c.motivo] || c.motivo) + '</td><td>' + (+c.ok ? '<span style="color:var(--verde);font-weight:600">Enviado</span>' : '<b style="color:var(--rojo)">Falló</b>') + '</td></tr>'; }).join('') +
        '</tbody></table></div>');
    }).catch(fallo);
  }

  // ------------------------------------------------------------------ Ajustes
  function vAjustes() {
    cargando();
    C.api('adm_ajustes').then(function (r) {
      var A = r.ajustes;
      M('<h1>Ajustes</h1><p class="sub-t">Datos de contacto, convocatoria y acceso.</p><div class="dos"><form class="tarjeta" id="fa"><h3>Convocatoria y contacto</h3>' +
        '<label class="interruptor" style="margin-bottom:16px"><input type="checkbox" id="a-conv"' + (A.convocatoria_abierta ? ' checked' : '') + '> Convocatoria abierta (se pueden crear y enviar propuestas nuevas)</label>' +
        '<div class="campos" style="grid-template-columns:1fr"><div class="campo"><label>Dirección de CLEMI</label><input id="a-dir" value="' + esc(A.direccion) + '"></div>' +
        '<div class="campo"><label>Teléfono de investigación</label><input id="a-tel" value="' + esc(A.telefono) + '" placeholder="+57 …"><span class="ayuda">Mientras esté vacío, en Contacto aparece «Próximamente».</span></div>' +
        '<div class="campo"><label>Correo de investigación (recibe cada postulación)</label><input id="a-cor" type="email" value="' + esc(A.correo) + '"></div>' +
        '<div class="campo"><label>Remitente de los correos automáticos</label><input id="a-rem" type="email" value="' + esc(A.remitente) + '"><span class="ayuda">Debe existir como cuenta en el hosting para que los correos no lleguen a spam.</span></div>' +
        '<div class="campo"><label>Horario (español)</label><input id="a-hor" value="' + esc(A.horario) + '"></div><div class="campo"><label>Horario (inglés)</label><input id="a-hoe" value="' + esc(A.horario_en) + '"></div>' +
        '<div class="campo"><label>Enlace del mapa</label><input id="a-map" value="' + esc(A.mapa) + '"></div></div>' +
        '<p style="margin:16px 0 0;display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-oro">Guardar</button><button type="button" class="btn btn-suave" id="b-prueba">Enviar correo de prueba</button></p></form>' +
        '<form class="tarjeta" id="fk"><h3>Acceso al panel interno</h3><p style="font-size:.9rem;color:var(--tinta-3)">Solo usted entra a este panel. Use una contraseña larga y no la comparta.</p><div class="campos" style="grid-template-columns:1fr">' +
        '<div class="campo"><label>Usuario</label><input id="k-u" value="' + esc(A.usuario) + '"></div><div class="campo"><label>Contraseña actual</label><input id="k-a" type="password" autocomplete="current-password"></div>' +
        '<div class="campo"><label>Nueva contraseña</label><input id="k-n" type="password" autocomplete="new-password"><span class="ayuda">Mínimo 10 caracteres, con letras y números.</span></div></div><p style="margin:16px 0 0"><button class="btn btn-azul">Cambiar contraseña</button></p></form></div>');
      $('#fa').onsubmit = function (e) {
        e.preventDefault();
        C.api('adm_ajustes_guardar', { convocatoria_abierta: $('#a-conv').checked, direccion: $('#a-dir').value, telefono: $('#a-tel').value, correo: $('#a-cor').value, remitente: $('#a-rem').value, horario: $('#a-hor').value, horario_en: $('#a-hoe').value, mapa: $('#a-map').value })
          .then(function () { C.aviso('Ajustes guardados.', 'exito'); }).catch(fallo);
      };
      $('#b-prueba').onclick = function () { C.api('adm_prueba_correo', {}).then(function (x) { C.aviso(x.enviado ? 'Correo de prueba enviado a ' + $('#a-cor').value + '.' : 'El hosting no pudo enviar el correo. Revise la configuración de correo.', x.enviado ? 'exito' : 'error'); }).catch(fallo); };
      $('#fk').onsubmit = function (e) {
        e.preventDefault();
        C.api('adm_clave', { usuario: $('#k-u').value, actual: $('#k-a').value, nueva: $('#k-n').value }).then(function () { C.aviso('Contraseña actualizada.', 'exito'); $('#k-a').value = ''; $('#k-n').value = ''; }).catch(fallo);
      };
    }).catch(fallo);
  }

  // ------------------------------------------------------------------ Arranque
  C.api('sesion').then(function (r) {
    C.csrf = r.csrf; S.tipos = r.tipos; S.checklist = r.checklist; S.checklistProt = r.checklist_protocolo; S.ajustes = r.ajustes;
    if (!r.admin) return login();
    marco(); ruta();
    C.api('adm_estado_sesion').then(function (x) { if (x.debe_cambiar) cambiarClaveObligatorio(); });
    C.api('adm_resumen').then(insignias).catch(function () {});
  }).catch(function () { $('#app').innerHTML = '<div class="login-adm"><p style="color:#fff">No se pudo conectar con el servidor.</p></div>'; });
  window.addEventListener('hashchange', function () { if ($('#m')) ruta(); });
})();
};</script>

</body></html>
