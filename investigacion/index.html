<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plataforma de Investigación CLEMI</title>
<meta name="description" content="Demostración de la Plataforma de Investigación CLEMI">
<style>
:root{color-scheme:light}
/* =====================================================================
   CLEMI · Plataforma de Investigación — estilos
   Paleta oficial (Manual de marca CLEMI): Azul CLEMI #1A2744 · Azul medio #2A4070
   Dorado #B8952A · Dorado claro #D4B050 · Verde CLEMI #2D5A3A · Crema #F4EFE4
   Tipografía: Times New Roman (titulares, identidad) + Source Sans 3 (lectura en pantalla)
   ===================================================================== */
@font-face { font-family: "Source Sans 3"; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/source-sans-3-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-style: italic; font-weight: 400; font-display: swap; src: url(assets/fonts/source-sans-3-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-style: normal; font-weight: 600; font-display: swap; src: url(assets/fonts/source-sans-3-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-style: normal; font-weight: 700; font-display: swap; src: url(assets/fonts/source-sans-3-latin-700-normal.woff2) format("woff2"); }
/* Tinos: métrica idéntica a Times New Roman, solo se usa donde Times New Roman no está instalada */
@font-face { font-family: "Tinos"; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/tinos-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Tinos"; font-style: italic; font-weight: 400; font-display: swap; src: url(assets/fonts/tinos-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "Tinos"; font-style: normal; font-weight: 700; font-display: swap; src: url(assets/fonts/tinos-latin-700-normal.woff2) format("woff2"); }

:root {
  --azul: #1A2744; --azul-2: #2A4070; --azul-3: #13203A; --azul-claro: #6888B8;
  --oro: #B8952A; --oro-claro: #D4B050; --oro-txt: #8A6B12; --oro-suave: #F3EAD0;
  --verde: #2D5A3A; --verde-suave: #E3EEE5;
  --crema: #F4EFE4; --papel: #FBF9F4; --blanco: #FFFFFF;
  --tinta: #1C2333; --tinta-2: #4A5468; --tinta-3: #6F7889;
  --linea: #E2DAC6; --linea-2: #EEE8DA;
  --rojo: #9B2C2C; --rojo-suave: #F8E5E3; --ambar: #8A5A00; --ambar-suave: #FBF0D9;
  --serif: "Times New Roman", Times, "Tinos", "Liberation Serif", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --radio: 6px; --sombra: 0 1px 2px rgba(26,39,68,.06), 0 6px 20px rgba(26,39,68,.07);
  --ancho: 1180px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--sans); font-size: 17px; line-height: 1.62; }
img, video { max-width: 100%; height: auto; }
a { color: var(--azul-2); text-underline-offset: 3px; }
a:hover { color: var(--oro-txt); }
h1, h2, h3, h4 { font-family: var(--serif); color: var(--azul); font-weight: 700; line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 400; letter-spacing: -.01em; }
h2 { font-size: clamp(1.55rem, 2.6vw, 2.1rem); font-weight: 400; }
h3 { font-size: 1.3rem; }
h4 { font-size: 1.08rem; }
p { margin: 0 0 1em; }
:focus-visible { outline: 3px solid var(--oro-claro); outline-offset: 2px; border-radius: 2px; }
.saltar { position: absolute; left: -999px; top: 0; background: var(--oro); color: var(--azul); padding: 8px 14px; z-index: 100; font-weight: 700; }
.saltar:focus { left: 8px; top: 8px; }
.cargando-pagina { min-height: 100vh; display: grid; place-items: center; background: var(--azul); }
.cargando-pagina img { animation: latido 1.6s ease-in-out infinite; }
@keyframes latido { 50% { opacity: .55; transform: scale(.97); } }
.contenedor { max-width: var(--ancho); margin: 0 auto; padding: 0 24px; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ------------------------------------------------------------ Encabezado */
.franja { background: var(--azul-3); color: #D9DEE8; font-size: .86rem; }
.franja .contenedor { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; }
.franja .lema { font-family: var(--serif); font-style: italic; color: #C9CFDB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.franja .acciones { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.idioma { display: inline-flex; border: 1px solid rgba(212,176,80,.45); border-radius: 999px; overflow: hidden; }
.idioma button { background: none; border: 0; color: #D9DEE8; font: 600 .78rem var(--sans); letter-spacing: .08em; padding: 5px 11px; cursor: pointer; }
.idioma button[aria-pressed="true"] { background: var(--oro-claro); color: var(--azul); }
.cabecera { background: var(--azul); border-bottom: 3px solid var(--oro); position: sticky; top: 0; z-index: 30; }
.cabecera .contenedor { display: flex; align-items: center; gap: 28px; min-height: 84px; }
.marca { display: flex; align-items: center; gap: 14px; text-decoration: none; flex-shrink: 0; }
.marca img.simbolo { height: 64px; width: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.marca .txt { display: flex; flex-direction: column; line-height: 1; }
.marca img.letras { height: 30px; width: auto; }
.marca .sub { font-family: var(--serif); color: #E7E1CF; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; margin-top: 7px; }
.menu { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.menu a { color: #E8EBF2; text-decoration: none; font-size: .95rem; font-weight: 600; padding: 9px 12px; border-bottom: 2px solid transparent; }
.menu a:hover { color: var(--oro-claro); }
.menu a[aria-current="page"] { color: var(--oro-claro); border-bottom-color: var(--oro-claro); }
.btn-menu { display: none; margin-left: auto; background: none; border: 1px solid rgba(212,176,80,.5); color: var(--oro-claro); border-radius: var(--radio); padding: 8px 12px; font: 600 .9rem var(--sans); cursor: pointer; }

/* ------------------------------------------------------------ Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 .98rem var(--sans); border-radius: var(--radio); padding: 10px 20px; border: 1px solid transparent; cursor: pointer; text-decoration: none; line-height: 1.2; transition: background .15s, color .15s, border-color .15s, transform .05s; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-oro { background: linear-gradient(180deg, #CDA73B, var(--oro)); color: var(--azul-3); border-color: #A9871F; }
.btn-oro:hover { background: var(--oro-claro); color: var(--azul-3); }
.btn-azul { background: var(--azul); color: #fff; }
.btn-azul:hover { background: var(--azul-2); color: #fff; }
.btn-linea { background: transparent; color: var(--azul); border-color: var(--azul); }
.btn-linea:hover { background: var(--azul); color: #fff; }
.btn-linea-oro { background: transparent; color: var(--oro-claro); border-color: var(--oro-claro); }
.btn-linea-oro:hover { background: var(--oro-claro); color: var(--azul); }
.btn-suave { background: var(--crema); color: var(--azul); border-color: var(--linea); }
.btn-suave:hover { background: var(--oro-suave); color: var(--azul); }
.btn-rojo { background: var(--rojo); color: #fff; }
.btn-verde { background: var(--verde); color: #fff; }
.btn-chico { padding: 6px 12px; font-size: .88rem; }
.btn-texto { background: none; border: 0; color: var(--azul-2); padding: 4px 6px; font: 600 .9rem var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.btn-texto.peligro { color: var(--rojo); }
.franja .btn { padding: 6px 14px; font-size: .85rem; }

/* ------------------------------------------------------------ Portada */
.heroe { position: relative; background: radial-gradient(ellipse at 85% 10%, rgba(42,64,112,.9), transparent 55%), linear-gradient(160deg, #1A2744 0%, #13203A 70%); color: #E9ECF3; overflow: hidden; }
.heroe::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 46px, rgba(212,176,80,.05) 46px 47px); pointer-events: none; }
.heroe .contenedor { position: relative; display: grid; grid-template-columns: 1.25fr .75fr; gap: 48px; align-items: center; padding-top: 72px; padding-bottom: 72px; }
.heroe .antetitulo { font-family: var(--sans); text-transform: uppercase; letter-spacing: .2em; font-size: .8rem; color: var(--oro-claro); font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
.heroe .antetitulo::before { content: ""; width: 34px; height: 1px; background: var(--oro-claro); }
.heroe h1 { color: #fff; font-size: clamp(2.2rem, 4.6vw, 3.6rem); margin-bottom: 20px; }
.heroe h1 em { color: var(--oro-claro); font-style: italic; }
.heroe p.entrada { font-size: 1.15rem; color: #CBD2E0; max-width: 40em; margin-bottom: 30px; }
.heroe .botones { display: flex; gap: 14px; flex-wrap: wrap; }
.heroe .emblema { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.medallon-aro { position: relative; width: min(360px, 100%); }
.medallon-aro::before { content: ""; position: absolute; inset: -16px; border: 1px solid rgba(212,176,80,.35); border-radius: 50%; pointer-events: none; }
.medallon { aspect-ratio: 1; max-width: 100%; border-radius: 50%; overflow: hidden; background: #e9e9ea; border: 3px solid var(--oro-claro); box-shadow: 0 22px 50px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.4); cursor: pointer; }
.medallon video { display: block; width: 100%; height: 100%; object-fit: cover; }
.cifras { background: var(--blanco); border-bottom: 1px solid var(--linea); }
.cifras .contenedor { display: grid; grid-template-columns: repeat(4, 1fr); }
.cifra { padding: 22px 20px; border-left: 1px solid var(--linea-2); }
.cifra:first-child { border-left: 0; }
.cifra b { display: block; font-family: var(--serif); font-size: 2.1rem; font-weight: 400; color: var(--azul); line-height: 1.1; }
.cifra span { color: var(--tinta-3); font-size: .9rem; }

.seccion { padding: 64px 0; }
.seccion.crema { background: var(--crema); }
.titulo-seccion { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; border-bottom: 1px solid var(--linea); padding-bottom: 14px; }
.titulo-seccion h2 { margin: 0; }
.titulo-seccion .kicker { display: block; font-family: var(--sans); font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--oro-txt); font-weight: 700; margin-bottom: 6px; }
.pasos { display: grid; grid-template-columns: 1.45fr 1.45fr 1fr 1fr; gap: 20px; counter-reset: paso; }
.paso { background: var(--blanco); border: 1px solid var(--linea); border-top: 3px solid var(--oro); padding: 22px; border-radius: 0 0 var(--radio) var(--radio); }
.paso::before { counter-increment: paso; content: counter(paso, upper-roman); font-family: var(--serif); font-size: 1.6rem; color: var(--oro-txt); display: block; margin-bottom: 6px; }
.paso h3 { font-size: 1.15rem; margin-bottom: 6px; }
.paso p { font-size: .95rem; color: var(--tinta-2); margin: 0; }
.paso-video { display: flex; flex-direction: column; text-decoration: none; color: inherit; overflow: hidden; transition: box-shadow .2s, transform .2s; }
.paso-video:hover { box-shadow: var(--sombra); transform: translateY(-2px); color: inherit; }
.paso-video video { order: -1; display: block; width: calc(100% + 44px); max-width: none; margin: -22px -22px 14px; aspect-ratio: 640 / 296; object-fit: cover; background: var(--azul); }
.paso-video h3 { color: var(--azul); }
.paso-video video + h3.sr + p { margin-top: 0; }
.acceso-lado .vid-lado { display: block; width: calc(100% + 68px); max-width: none; margin: -40px -34px 6px; aspect-ratio: 640 / 296; object-fit: cover; background: var(--azul); border-bottom: 2px solid var(--oro); }

/* Actualidad */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { border: 1px solid var(--linea); background: var(--blanco); color: var(--tinta-2); border-radius: 999px; padding: 6px 14px; font: 600 .86rem var(--sans); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }
.noticias { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.noticia { background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: box-shadow .2s, transform .2s; }
.noticia:hover { box-shadow: var(--sombra); transform: translateY(-2px); color: inherit; }
.noticia .img { aspect-ratio: 16/9; background: linear-gradient(135deg, var(--azul), var(--azul-2)); display: grid; place-items: center; overflow: hidden; }
.noticia .img img { width: 100%; height: 100%; object-fit: cover; }
.noticia .img .sello { width: 62px; opacity: .85; }
.noticia .cuerpo { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.noticia h3 { font-size: 1.22rem; font-weight: 400; margin: 0; }
.noticia p { font-size: .95rem; color: var(--tinta-2); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.noticia .meta { margin-top: auto; font-size: .82rem; color: var(--tinta-3); }
.noticia.destacada { grid-column: span 2; flex-direction: row; }
.noticia.destacada .img { aspect-ratio: auto; flex: 1.1; min-height: 260px; }
.noticia.destacada .cuerpo { flex: 1; padding: 28px; }
.noticia.destacada h3 { font-size: 1.6rem; }
.etiqueta { display: inline-flex; align-items: center; gap: 6px; font: 700 .72rem var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; align-self: flex-start; }
.etq-anuncio { background: #E6ECF6; color: var(--azul-2); }
.etq-publicacion { background: var(--verde-suave); color: var(--verde); }
.etq-premiada { background: var(--oro-suave); color: var(--oro-txt); }
.etq-convocatoria { background: #EFE6F3; color: #5B3470; }
.etq-evento { background: #E4EEF0; color: #1F5560; }

/* Archivo */
.barra-archivo { display: grid; grid-template-columns: 1fr 200px 160px; gap: 12px; margin-bottom: 24px; }
.lista-articulos { display: flex; flex-direction: column; }
.articulo { display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 26px 0; border-bottom: 1px solid var(--linea); }
.articulo .mini { aspect-ratio: 4/3; background: var(--crema); border: 1px solid var(--linea); border-radius: 4px; overflow: hidden; display: grid; place-items: center; }
.articulo .mini img { width: 100%; height: 100%; object-fit: cover; }
.articulo .mini .sello { width: 46px; opacity: .5; }
.articulo h3 { font-size: 1.35rem; font-weight: 400; margin: 6px 0 6px; }
.articulo h3 a { color: var(--azul); text-decoration: none; }
.articulo h3 a:hover { color: var(--oro-txt); text-decoration: underline; }
.articulo .autores { font-size: .95rem; color: var(--tinta-2); margin-bottom: 8px; }
.articulo .extracto { font-size: .95rem; color: var(--tinta-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0 0 8px; }
.articulo .datos { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84rem; color: var(--tinta-3); align-items: center; }
.codigo { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .82em; letter-spacing: .02em; color: var(--tinta-3); }
.vacio { text-align: center; padding: 56px 20px; color: var(--tinta-3); border: 1px dashed var(--linea); border-radius: var(--radio); background: var(--blanco); }
.vacio img { width: 54px; opacity: .45; margin-bottom: 10px; }

/* Lectura de un artículo publicado */
.lectura { display: grid; grid-template-columns: 1fr 280px; gap: 48px; padding: 48px 0 72px; }
.lectura article { background: var(--blanco); border: 1px solid var(--linea); padding: 44px 52px; border-radius: var(--radio); }
.lectura .titulo-art { font-size: clamp(1.8rem, 3.4vw, 2.5rem); margin-bottom: 14px; }
.lectura .firma { font-size: 1rem; color: var(--tinta-2); border-bottom: 1px solid var(--linea); padding-bottom: 18px; margin-bottom: 26px; }
.lectura .resumen-caja { background: var(--crema); border-left: 3px solid var(--oro); padding: 18px 22px; margin-bottom: 30px; }
.lectura .resumen-caja h4 { text-transform: uppercase; letter-spacing: .12em; font-family: var(--sans); font-size: .8rem; color: var(--oro-txt); }
.texto-largo { font-family: var(--serif); font-size: 1.16rem; line-height: 1.72; color: #222a38; }
.texto-largo h3 { font-size: 1.4rem; margin-top: 1.6em; padding-top: .3em; border-top: 1px solid var(--linea-2); }
.texto-largo p { margin-bottom: .9em; }
.texto-largo .referencias p { font-family: var(--sans); font-size: .9rem; line-height: 1.5; padding-left: 2em; text-indent: -2em; }
.medios { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 20px 0; }
.medio figure { margin: 0; background: var(--papel); border: 1px solid var(--linea); border-radius: 4px; overflow: hidden; }
.medio img, .medio video, .medio iframe { width: 100%; display: block; background: #000; }
.medio img { background: #fff; cursor: zoom-in; }
.medio iframe { aspect-ratio: 16/9; border: 0; }
.medio figcaption { font-size: .88rem; padding: 10px 12px; color: var(--tinta-2); }
.medio figcaption b { color: var(--azul); }
.lateral { position: sticky; top: 110px; align-self: start; display: flex; flex-direction: column; gap: 16px; }
.ficha { background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--radio); padding: 18px 20px; font-size: .92rem; }
.ficha h4 { font-family: var(--sans); text-transform: uppercase; letter-spacing: .12em; font-size: .74rem; color: var(--oro-txt); margin-bottom: 8px; }
.ficha dl { margin: 0; display: grid; gap: 8px; }
.ficha dt { color: var(--tinta-3); font-size: .8rem; }
.ficha dd { margin: 0 0 4px; font-weight: 600; color: var(--azul); }
.ficha nav a { display: block; padding: 4px 0; text-decoration: none; font-size: .92rem; }
.premio { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #FFF8E6, var(--oro-suave)); border: 1px solid #E2CC8A; color: var(--oro-txt); padding: 12px 16px; border-radius: var(--radio); font-weight: 600; margin-bottom: 22px; }
.premio svg { flex-shrink: 0; }

/* Páginas de texto (guía, privacidad) */
.pagina { display: grid; grid-template-columns: 250px 1fr; gap: 48px; padding: 48px 0 72px; }
.pagina .indice { position: sticky; top: 110px; align-self: start; font-size: .92rem; border-left: 2px solid var(--linea); padding-left: 16px; max-height: calc(100vh - 140px); overflow: auto; }
.pagina .indice b { display: block; font-family: var(--sans); text-transform: uppercase; letter-spacing: .14em; font-size: .74rem; color: var(--oro-txt); margin-bottom: 8px; }
.pagina .indice a { display: block; padding: 5px 0; color: var(--tinta-2); text-decoration: none; }
.pagina .indice a:hover { color: var(--azul); }
.doc { background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--radio); padding: 44px 52px; max-width: 860px; }
.doc h2 { margin-top: 1.8em; padding-top: .6em; border-top: 1px solid var(--linea-2); scroll-margin-top: 110px; }
.doc h2:first-of-type { margin-top: .4em; border-top: 0; padding-top: 0; }
.doc h3 { margin-top: 1.4em; scroll-margin-top: 110px; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li { margin-bottom: .45em; }
.doc .nota { background: var(--crema); border-left: 3px solid var(--oro); padding: 14px 18px; margin: 18px 0; font-size: .96rem; }
.doc .ejemplo { font-size: .92rem; background: var(--papel); border: 1px solid var(--linea-2); padding: 10px 14px; border-radius: 4px; margin: 6px 0 12px; }
.tabla-wrap { overflow-x: auto; margin: 16px 0 24px; border: 1px solid var(--linea); border-radius: var(--radio); }
table.tabla { border-collapse: collapse; width: 100%; font-size: .92rem; background: var(--blanco); }
.tabla th, .tabla td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--linea-2); vertical-align: top; }
.tabla thead th { background: var(--azul); color: #fff; font-weight: 600; font-size: .84rem; white-space: nowrap; }
.tabla tbody tr:nth-child(even) { background: #FCFAF5; }
.tabla td.num { text-align: center; font-variant-numeric: tabular-nums; }
.plantillas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 14px 0 20px; }
.plantilla { display: flex; gap: 12px; align-items: center; border: 1px solid var(--linea); border-radius: var(--radio); padding: 12px 14px; text-decoration: none; color: var(--azul); font-weight: 600; font-size: .94rem; background: var(--papel); }
.plantilla:hover { border-color: var(--oro); background: var(--oro-suave); }
.plantilla small { display: block; font-weight: 400; color: var(--tinta-3); }

/* Contacto */
.contacto { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; padding: 48px 0 72px; }
.datos-contacto { background: var(--azul); color: #E5E9F1; border-radius: var(--radio); padding: 36px; position: relative; overflow: hidden; }
.datos-contacto::after { content: ""; position: absolute; right: -60px; bottom: -60px; width: 240px; height: 240px; background: url(assets/simbolo-inv.png) center/contain no-repeat; opacity: .1; }
.datos-contacto h2 { color: #fff; }
.dato { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.dato svg { flex-shrink: 0; color: var(--oro-claro); margin-top: 3px; }
.dato small { display: block; color: #9FAAC0; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }
.dato a { color: #fff; }
.dato a:hover { color: var(--oro-claro); }

/* ------------------------------------------------------------ Formularios */
.tarjeta { background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--radio); padding: 28px 30px; }
.tarjeta + .tarjeta { margin-top: 20px; }
.tarjeta h3 { margin-bottom: 14px; }
.campos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 20px; }
.campos .ancho { grid-column: 1 / -1; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo > label, .etq { font-weight: 600; font-size: .92rem; color: var(--azul); }
.campo .req { color: var(--rojo); margin-left: 2px; }
.campo .ayuda { font-size: .84rem; color: var(--tinta-3); }
input:not([type]), input[type=text], input[type=email], input[type=password], input[type=tel], input[type=search], input[type=url], input[type=date], input[type=number], select, textarea {
  font: 400 1rem var(--sans); color: var(--tinta); background: #fff; border: 1px solid #CFC6B0; border-radius: var(--radio); padding: 10px 12px; width: 100%; transition: border-color .15s, box-shadow .15s; }
textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--oro); box-shadow: 0 0 0 3px rgba(212,176,80,.28); }
.campo.error input, .campo.error select, .campo.error textarea { border-color: var(--rojo); background: #FFFBFA; }
.campo .msg-error { color: var(--rojo); font-size: .85rem; font-weight: 600; }
.grupo-tel { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
.grupo-doc { display: grid; grid-template-columns: 170px 1fr; gap: 8px; }
.casilla { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--papel); cursor: pointer; font-size: .96rem; }
.casilla input { width: 20px; height: 20px; margin-top: 3px; flex-shrink: 0; accent-color: var(--azul); }
.casilla.marcada { border-color: var(--oro); background: #FFFCF3; }
.casilla.error { border-color: var(--rojo); background: var(--rojo-suave); }
.ojo { position: relative; }
.ojo button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--tinta-3); cursor: pointer; padding: 6px; font: 600 .8rem var(--sans); }
.medidor { height: 4px; background: var(--linea-2); border-radius: 2px; overflow: hidden; }
.medidor i { display: block; height: 100%; width: 0; background: var(--rojo); transition: width .2s, background .2s; }
.alerta { padding: 12px 16px; border-radius: var(--radio); font-size: .95rem; margin-bottom: 16px; border: 1px solid; }
.alerta.info { background: #EEF2F9; border-color: #C9D4E8; color: var(--azul-2); }
.alerta.exito { background: var(--verde-suave); border-color: #BCD6C2; color: var(--verde); }
.alerta.aviso { background: var(--ambar-suave); border-color: #EBD3A0; color: var(--ambar); }
.alerta.error { background: var(--rojo-suave); border-color: #E7BCB7; color: var(--rojo); }
.acceso-caja { max-width: 980px; margin: 48px auto 72px; display: grid; grid-template-columns: 1fr 1.25fr; border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; background: var(--blanco); box-shadow: var(--sombra); }
.acceso-caja.registro { max-width: 1100px; grid-template-columns: .7fr 1.3fr; }
.acceso-lado { background: linear-gradient(170deg, var(--azul), var(--azul-3)); color: #DCE1EA; padding: 40px 34px; display: flex; flex-direction: column; gap: 16px; }
.acceso-lado img { width: 120px; }
.acceso-lado h2 { color: #fff; font-size: 1.7rem; }
.acceso-lado ul { padding-left: 0; list-style: none; margin: 0; display: grid; gap: 12px; font-size: .95rem; }
.acceso-lado li { display: flex; gap: 10px; }
.acceso-lado li::before { content: "◆"; color: var(--oro-claro); font-size: .7rem; margin-top: 5px; }
.acceso-form { padding: 40px 38px; }
.acceso-form h1 { font-size: 2rem; }

/* ------------------------------------------------------------ Panel del investigador */
.panel-cab { background: var(--crema); border-bottom: 1px solid var(--linea); }
.panel-cab .contenedor { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 26px; padding-bottom: 0; flex-wrap: wrap; }
.panel-cab h1 { font-size: 1.9rem; margin: 0; }
.panel-cab .quien { color: var(--tinta-2); font-size: .95rem; }
.pestanas { display: flex; gap: 4px; margin-top: 18px; width: 100%; overflow-x: auto; }
.pestanas a { padding: 11px 18px; text-decoration: none; color: var(--tinta-2); font-weight: 600; font-size: .95rem; border-bottom: 3px solid transparent; white-space: nowrap; }
.pestanas a[aria-current="page"] { color: var(--azul); border-bottom-color: var(--oro); }
.panel-cuerpo { padding: 32px 0 72px; }
.estado { display: inline-flex; align-items: center; gap: 7px; font: 700 .78rem var(--sans); letter-spacing: .04em; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.est-borrador { background: #EEF0F3; color: #555F70; }
.est-enviada { background: #E6ECF6; color: var(--azul-2); }
.est-revision { background: #EFE6F3; color: #5B3470; }
.est-ajustes { background: var(--ambar-suave); color: var(--ambar); }
.est-aprobada { background: var(--verde-suave); color: var(--verde); }
.est-denegada { background: var(--rojo-suave); color: var(--rojo); }
.mis-propuestas { display: grid; gap: 14px; }
.mi-prop { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; background: var(--blanco); border: 1px solid var(--linea); border-left: 4px solid var(--linea); border-radius: var(--radio); padding: 18px 22px; text-decoration: none; color: inherit; }
.mi-prop:hover { box-shadow: var(--sombra); color: inherit; }
.mi-prop.e-ajustes { border-left-color: var(--ambar); }
.mi-prop.e-aprobada { border-left-color: var(--verde); }
.mi-prop.e-denegada { border-left-color: var(--rojo); }
.mi-prop.e-enviada, .mi-prop.e-revision { border-left-color: var(--azul-2); }
.mi-prop h3 { font-size: 1.18rem; font-weight: 400; margin: 4px 0; }
.mi-prop .linea { font-size: .86rem; color: var(--tinta-3); display: flex; gap: 12px; flex-wrap: wrap; }
.mi-prop .msg { font-size: .9rem; color: var(--ambar); margin-top: 6px; }

/* Seguimiento: línea de tiempo */
.progreso { display: flex; margin: 8px 0 26px; }
.progreso .hito { flex: 1; text-align: center; position: relative; font-size: .82rem; color: var(--tinta-3); padding-top: 30px; }
.progreso .hito::before { content: ""; position: absolute; top: 9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--blanco); border: 2px solid var(--linea); z-index: 1; }
.progreso .hito::after { content: ""; position: absolute; top: 17px; left: -50%; width: 100%; height: 2px; background: var(--linea); }
.progreso .hito:first-child::after { display: none; }
.progreso .hito.hecho { color: var(--azul); font-weight: 600; }
.progreso .hito.hecho::before { background: var(--oro); border-color: var(--oro); }
.progreso .hito.hecho::after { background: var(--oro); }
.progreso .hito.mal::before { background: var(--rojo); border-color: var(--rojo); }
.progreso .hito.alerta-h::before { background: var(--ambar); border-color: var(--ambar); }
.tiempo { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--linea); }
.tiempo li { position: relative; padding: 0 0 18px 16px; }
.tiempo li::before { content: ""; position: absolute; left: -29px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--oro); border: 2px solid var(--blanco); box-shadow: 0 0 0 1px var(--oro); }
.tiempo li.admin::before { background: var(--azul); box-shadow: 0 0 0 1px var(--azul); }
.tiempo .cuando { font-size: .8rem; color: var(--tinta-3); }
.tiempo .que { font-weight: 600; color: var(--azul); }
.tiempo .mensaje { margin-top: 6px; background: var(--crema); border-left: 3px solid var(--oro); padding: 10px 14px; font-size: .95rem; white-space: pre-wrap; }
.tiempo .nota-int { margin-top: 6px; background: #F1F3F8; border-left: 3px solid var(--azul-claro); padding: 8px 12px; font-size: .88rem; white-space: pre-wrap; color: var(--tinta-2); }

/* Asistente de postulación */
.asistente { display: grid; grid-template-columns: 250px 1fr; gap: 32px; align-items: start; }
.pasos-asis { position: sticky; top: 110px; list-style: none; margin: 0; padding: 0; background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; }
.pasos-asis li button { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--linea-2); padding: 13px 16px; font: 600 .93rem var(--sans); color: var(--tinta-2); cursor: pointer; }
.pasos-asis li:last-child button { border-bottom: 0; }
.pasos-asis li button .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--linea); font-size: .8rem; flex-shrink: 0; font-family: var(--serif); }
.pasos-asis li button[aria-current="step"] { background: var(--oro-suave); color: var(--azul); }
.pasos-asis li button[aria-current="step"] .n { background: var(--azul); color: #fff; border-color: var(--azul); }
.pasos-asis li button.ok .n { background: var(--verde); border-color: var(--verde); color: #fff; }
.pasos-asis li button.falta .n { border-color: var(--ambar); color: var(--ambar); }
.pasos-asis .guardado { padding: 10px 16px; font-size: .78rem; color: var(--tinta-3); background: var(--papel); border-top: 1px solid var(--linea-2); }
.pie-asis { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.seccion-txt { margin-bottom: 26px; }
.seccion-txt .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.seccion-txt label { font-family: var(--serif); font-size: 1.22rem; color: var(--azul); font-weight: 700; }
.contador { font: 600 .82rem var(--sans); color: var(--tinta-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.contador.cerca { color: var(--ambar); }
.contador.lleno { color: var(--rojo); }
.barra-palabras { height: 3px; background: var(--linea-2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.barra-palabras i { display: block; height: 100%; background: var(--verde); width: 0; transition: width .15s; }
.barra-palabras.cerca i { background: var(--ambar); }
.barra-palabras.lleno i { background: var(--rojo); }
.seccion-txt textarea { min-height: 220px; font-size: 1.02rem; }
.kw { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid #CFC6B0; border-radius: var(--radio); padding: 7px; background: #fff; }
.kw span { background: var(--oro-suave); color: var(--azul); border-radius: 4px; padding: 4px 6px 4px 10px; font-size: .92rem; display: inline-flex; gap: 6px; align-items: center; }
.kw span button { border: 0; background: none; cursor: pointer; color: var(--tinta-3); font-size: 1rem; line-height: 1; padding: 0 4px; }
.kw input { border: 0 !important; box-shadow: none !important; flex: 1; min-width: 160px; padding: 4px; }
.tipos-art { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tipo-art { border: 1.5px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; cursor: pointer; background: var(--blanco); display: flex; flex-direction: column; gap: 4px; }
.tipo-art input { position: absolute; opacity: 0; pointer-events: none; }
.tipos-art .tipo-art:first-child { grid-column: 1 / -1; border-width: 2px; }
.texto-largo h3.grupo-sec { border-top: 2px solid var(--oro); font-size: 1.55rem; color: var(--azul); margin-top: 1.8em; }
.texto-largo h3.grupo-sec + h3 { border-top: 0; margin-top: .4em; padding-top: 0; }
details > summary { list-style-position: inside; }
.tipo-art b { font-family: var(--serif); font-size: 1.1rem; color: var(--azul); }
.tipo-art small { color: var(--tinta-3); font-size: .82rem; line-height: 1.4; }
.tipo-art:has(input:checked) { border-color: var(--oro); background: #FFFCF3; box-shadow: 0 0 0 3px rgba(212,176,80,.2); }
.tipo-art:has(input:focus-visible) { outline: 3px solid var(--oro-claro); }
.coautor { border: 1px solid var(--linea); border-radius: var(--radio); padding: 16px; margin-bottom: 12px; background: var(--papel); position: relative; }
.coautor .quitar { position: absolute; top: 8px; right: 8px; }
.zona-subida { border: 2px dashed #CDBF98; border-radius: var(--radio); padding: 26px; text-align: center; background: #FFFDF8; transition: background .15s, border-color .15s; cursor: pointer; }
.zona-subida:hover, .zona-subida.sobre { background: var(--oro-suave); border-color: var(--oro); }
.zona-subida b { color: var(--azul); display: block; font-size: 1.02rem; }
.zona-subida small { color: var(--tinta-3); }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 16px; }
.pieza { border: 1px solid var(--linea); border-radius: var(--radio); background: var(--blanco); overflow: hidden; display: flex; flex-direction: column; }
.pieza .vista { aspect-ratio: 4/3; background: #EDE8DC; display: grid; place-items: center; overflow: hidden; position: relative; }
.pieza .vista img, .pieza .vista video { width: 100%; height: 100%; object-fit: cover; }
.pieza .vista .num { position: absolute; left: 6px; top: 6px; background: var(--azul); color: #fff; font: 700 .72rem var(--sans); padding: 2px 7px; border-radius: 3px; }
.pieza .info { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: .82rem; }
.pieza .info input { font-size: .85rem; padding: 6px 8px; }
.pieza .acc { display: flex; justify-content: space-between; align-items: center; }
.barra-carga { height: 6px; background: var(--linea-2); border-radius: 3px; overflow: hidden; }
.barra-carga i { display: block; height: 100%; background: linear-gradient(90deg, var(--oro), var(--oro-claro)); width: 0; transition: width .2s; }
.docs-lista { display: grid; gap: 10px; }
.doc-fila { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; border: 1px solid var(--linea); border-radius: var(--radio); padding: 12px 16px; background: var(--blanco); }
.doc-fila.falta { border-color: #EBD3A0; background: #FFFBF1; }
.doc-fila .nom { font-weight: 600; color: var(--azul); }
.doc-fila .sub { font-size: .84rem; color: var(--tinta-3); }
.doc-fila .archivos-doc { font-size: .86rem; margin-top: 4px; display: flex; flex-direction: column; gap: 3px; }
.verif { display: grid; gap: 8px; }
.verif .casilla { font-size: .94rem; }
.resumen-envio { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 24px; }
.check-ok, .check-mal { display: flex; gap: 8px; align-items: flex-start; font-size: .94rem; }
.check-ok::before { content: "✓"; color: var(--verde); font-weight: 700; }
.check-mal::before { content: "!"; color: #fff; background: var(--ambar); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; flex-shrink: 0; margin-top: 3px; }
.guia-previa { max-height: 420px; overflow: auto; border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px 26px; background: var(--papel); margin-bottom: 16px; }
.guia-previa h2 { font-size: 1.3rem; }
.guia-previa h3 { font-size: 1.1rem; }

/* ------------------------------------------------------------ Pie */
.pie { background: var(--azul-3); color: #B9C2D3; font-size: .92rem; border-top: 3px solid var(--oro); }
.pie .contenedor { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 40px; padding-top: 48px; padding-bottom: 36px; }
.pie img { height: 150px; width: auto; margin-bottom: 12px; }
.pie h4 { color: var(--oro-claro); font-family: var(--sans); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; }
.pie a { color: #DCE2EC; text-decoration: none; }
.pie a:hover { color: var(--oro-claro); }
.pie ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.pie .final { border-top: 1px solid rgba(255,255,255,.08); padding: 16px 0; font-size: .82rem; text-align: center; color: #8893A8; }
.pie .final em { font-family: var(--serif); color: #C7CEDB; }

/* ------------------------------------------------------------ Modal y avisos */
.velo { position: fixed; inset: 0; background: rgba(15,22,40,.6); z-index: 80; display: grid; place-items: center; padding: 20px; animation: aparecer .15s; }
.modal { background: var(--blanco); border-radius: var(--radio); max-width: 760px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.ancho { max-width: 1000px; }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--linea); gap: 16px; }
.modal header h3 { margin: 0; }
.modal .contenido { padding: 22px 24px; overflow: auto; }
.modal footer { padding: 14px 24px; border-top: 1px solid var(--linea); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.cerrar { background: none; border: 0; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--tinta-3); padding: 4px 8px; }
.avisos { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; gap: 10px; max-width: 380px; }
.aviso-t { background: var(--azul); color: #fff; padding: 13px 18px; border-radius: var(--radio); box-shadow: var(--sombra); font-size: .94rem; border-left: 4px solid var(--oro-claro); animation: aparecer .2s; }
.aviso-t.error { border-left-color: #E07A6F; background: #3A1D22; }
.aviso-t.exito { border-left-color: #7FC08F; }
@keyframes aparecer { from { opacity: 0; transform: translateY(6px); } }
.visor { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 95; display: grid; place-items: center; cursor: zoom-out; padding: 20px; }
.visor img { max-height: 92vh; max-width: 96vw; }
.cargando { padding: 60px; text-align: center; color: var(--tinta-3); }
.cargando::before { content: ""; display: block; width: 34px; height: 34px; margin: 0 auto 12px; border: 3px solid var(--linea); border-top-color: var(--oro); border-radius: 50%; animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------ Adaptable */
@media (max-width: 1080px) {
  .menu { display: none; position: absolute; left: 0; right: 0; top: 100%; background: var(--azul); flex-direction: column; padding: 8px 24px 16px; border-bottom: 3px solid var(--oro); }
  .menu.abierto { display: flex; }
  .menu a { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .btn-menu { display: inline-flex; }
  .cabecera .contenedor { position: relative; }
}
@media (max-width: 900px) {
  .heroe .contenedor, .lectura, .pagina, .contacto, .asistente, .acceso-caja, .acceso-caja.registro { grid-template-columns: 1fr; }
  .heroe .emblema { order: -1; gap: 14px; }
  .medallon-aro { width: min(240px, 72vw); }
  .noticias { grid-template-columns: repeat(2, 1fr); }
  .noticia.destacada { grid-column: 1 / -1; flex-direction: column; }
  .noticia.destacada .img { min-height: 200px; }
  .pasos { grid-template-columns: repeat(2, 1fr); }
  .cifras .contenedor { grid-template-columns: repeat(2, 1fr); }
  .cifra:nth-child(3) { border-left: 0; }
  .lateral, .pagina .indice, .pasos-asis { position: static; }
  .pagina .indice { display: none; }
  .pasos-asis { display: flex; overflow-x: auto; }
  .pasos-asis li { flex: 1 0 auto; }
  .pasos-asis li button { border-bottom: 0; border-right: 1px solid var(--linea-2); }
  .pasos-asis li button .t { display: none; }
  .pasos-asis li button[aria-current="step"] .t { display: inline; }
  .pasos-asis .guardado { display: none; }
  .pie .contenedor { grid-template-columns: 1fr; gap: 24px; }
  .acceso-lado { display: none; }
  .tipos-art { grid-template-columns: repeat(2, 1fr); }
  .barra-archivo { grid-template-columns: 1fr 1fr; }
  .barra-archivo .buscar { grid-column: 1 / -1; }
}

          : '* By invitation of the Research Committee. Body word limit excludes figure legends, table titles and references. On this platform, <b>each section also accepts a maximum of 1,000 words</b>.') + '</p>';
  }
  function tablaDocs(es) {
    var f = es ? [['a. Carta de presentación', 'El autor correspondiente'], ['b. Formulario del Comité de Ética', 'El autor correspondiente'], ['c. Conflicto de intereses', 'Todos los autores'], ['d. Permiso para utilizar figuras y tablas', 'El autor correspondiente'], ['e. Transferencia de derechos de autor', 'Todos los autores']]
               : [['a. Cover letter', 'Corresponding author'], ['b. Ethics Committee form', 'Corresponding author'], ['c. Conflict of interest', 'All authors'], ['d. Permission to use figures and tables', 'Corresponding author'], ['e. Copyright transfer', 'All authors']];
    var c = es ? ['Documento / declaración', 'Firma', '¿Cuándo anexar?'] : ['Document / statement', 'Signed by', 'When to attach?'];
    return '<div class="tabla-wrap"><table class="tabla"><thead><tr><th>' + c.join('</th><th>') + '</th></tr></thead><tbody>' +
      f.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + (es ? 'Al enviar la propuesta' : 'At submission') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function listaChk(es) {
    var L = T.checklist[es ? 'es' : 'en'];

  }
  function plantillas(es) {
    var p = [['carta', es ? 'Carta de presentación' : 'Cover letter'], ['titulo', es ? 'Página de título' : 'Title page'],
      ['etica', es ? 'Formulario del Comité de Ética' : 'Ethics Committee form'], ['conflicto', es ? 'Declaración de conflicto de intereses' : 'Conflict of interest statement'],
      ['derechos', es ? 'Transferencia de derechos de autor' : 'Copyright transfer']];
    return '<div class="plantillas">' + p.map(function (x) {
      return '<a class="plantilla" href="assets/plantillas/CLEMI-' + x[0] + (es ? '' : '-EN') + '.docx" download><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span>' + x[1] + '<small>' + (es ? 'Plantilla Word (.docx)' : 'Word template (.docx)') + '</small></span></a>';
    }).join('') + '</div>';
  }

  T.guia = {
    es: function () { return '' +
      '<h2 id="g-info">Información</h2>' +
      '<p>En nombre de CLEMI le agradecemos enormemente que envíe su trabajo a nuestra Plataforma de Investigación. Para estandarizar y mejorar la evaluación de las propuestas, adoptamos la <b>Declaración STROBE</b> y las guías de la Red EQUATOR como referencia de trabajo para autores y evaluadores. Confiamos en que así habrá mayor fluidez y claridad entre las partes, lo que facilitará y agilizará evaluar, orientar y corregir los trabajos.</p>' +
      '<p>Toda la información de los autores y del servicio donde se realizó el estudio debe ir <b>únicamente en la página de título</b>. El equipo editorial hará una primera revisión y ocultará cualquier dato que pueda comprometer la evaluación anónima. El texto debe tener todas las líneas numeradas consecutivamente: los evaluadores usarán esa numeración para referirse a las correcciones, explicándolas de forma clara, objetiva y constructiva.</p>' +
      '<p>En su panel personal verá todas las observaciones sobre cada sección clásica del trabajo: Título, Resumen, Introducción, Métodos, Resultados, Discusión, Conclusiones, Figuras y Tablas y Referencias. <b>Todas las preguntas de los evaluadores, sin excepción, deben ser respondidas por los autores.</b></p>' +
      '<p>Las correcciones incorporadas al nuevo texto deben ir <b>resaltadas</b> para facilitar la relectura. Los textos corregidos se reenvían desde el panel para las siguientes rondas de evaluación, en el menor tiempo posible.</p>' +
      '<div class="nota"><b>Cómo funciona esta plataforma.</b> Cree su cuenta personal e intransferible, acepte esta guía, diligencie la propuesta por secciones (máximo <b>1000 palabras por sección</b>), adjunte imágenes, videos y documentos, marque la lista de verificación y envíe. Recibirá un código único (por ejemplo, CLEMI-INV-2026-0001) y podrá seguir el estado en su panel: <i>Recibida, En revisión, Requiere ajustes, Aprobada o Denegada</i>.</div>' +
      '<h2 id="g-tipos">Tipos de artículo y límites</h2>' + tablaTipos(true) +
      '<h3>Tarifa de publicación</h3><p>No se cobra ninguna tarifa por evaluar ni publicar los artículos.</p>' +
      '<h3 id="g-desc">Descripción de las categorías</h3>' +
      '<p><b>Artículo original.</b> Incluye estudios controlados y aleatorizados, estudios observacionales, registros e investigación básica con animales de experimentación. Debe contener: Resumen, Introducción, Métodos, Resultados, Discusión, Conclusiones y Referencias (preferiblemente no más de 40).</p>' +
      '<p><b>Informe de caso.</b> Descripciones de casos de pacientes, situaciones particulares, enfermedades raras o nunca antes descritas, y métodos innovadores de diagnóstico o tratamiento. Debe centrarse en temas comparables con la literatura y no exceder diez referencias.</p>' +
      '<p><b>Revisión sistemática.</b> El Comité evaluará la calidad y la relevancia del tema. Siga las recomendaciones PRISMA y, preferiblemente, incluya el número de registro en PROSPERO.</p>' +
      '<p><b>Consejo técnico.</b> Ofrece una sugerencia o modificación de un procedimiento o aplicación clínica preexistente y documentada. Los procedimientos completamente nuevos NO son consejos técnicos y deben enviarse como artículo original.</p>' +
      '<p><b>Artículo especial.</b> Artículos que no pertenecen a las categorías anteriores, pero que el Comité considera relevantes.</p>' +
      '<p><b>Carta al editor.</b> Comenta, debate o critica artículos publicados por CLEMI o aborda temas de interés general. La respuesta de los autores aludidos podrá publicarse junto con la carta.</p>' +
      '<p><b>Editorial.</b> Temas seleccionados por su relevancia; los escribe el Comité o especialistas invitados.</p>' +
      '<h2 id="g-listas">Lista de verificación de investigación</h2>' +
      '<p>CLEMI exige cumplir las siguientes guías de reporte. Suba la lista diligenciada con su propuesta, rotulada «Lista de verificación de investigación», indicando el número de página junto a cada criterio. Si su trabajo no corresponde a ninguna, busque la guía más pertinente en la Red EQUATOR (<a href="https://www.equator-network.org" target="_blank" rel="noopener">www.equator-network.org</a>) o explique el motivo en la carta de presentación.</p>' +
      '<ul><li><b>CONSORT</b>: ensayos controlados aleatorios y estudios experimentales.</li><li><b>PRISMA</b>: revisiones sistemáticas.</li><li><b>CHEERS</b>: evaluaciones económicas.</li><li><b>STARD</b>: investigación diagnóstica.</li><li><b>STROBE</b>: estudios observacionales.</li><li><b>MOOSE</b>: metaanálisis de estudios observacionales.</li><li><b>GRRAS</b>: estudios de fiabilidad y concordancia.</li><li><b>BRISQ</b>: informes de muestras biológicas.</li><li><b>CARE</b>: informes de caso.</li></ul>' +
      '<h2 id="g-titulo">Página de título</h2><p>Se envía en un archivo aparte e incluye:</p><ul>' +

      '<li>Número ORCID (<a href="https://orcid.org" target="_blank" rel="noopener">orcid.org</a>) del autor y de todos los coautores.</li>' +
      '<li>Lugar donde se realizó el estudio.</li>' +
      '<li>Si el trabajo se presentó en un congreso o reunión: nombre oficial, lugar y fecha.</li>' +

      '<li>La «Contribución de los autores». Cada autor debe cumplir al menos dos criterios: (a) concibió o planificó las actividades que dieron lugar al artículo, o interpretó los resultados, o ambas; (b) escribió el artículo o revisó las versiones sucesivas y participó en la revisión; (c) aprobó la versión final.</li></ul>' +
      '<div class="ejemplo"><b>Ejemplo.</b> Cada autor contribuyó personal y significativamente al desarrollo de este artículo: <i>Nombre del autor</i>: concibió y planificó las actividades que llevaron al estudio, escribió el artículo, participó en la revisión y aprobó la versión final; <i>Nombre del autor</i>: interpretó los resultados y participó en la revisión; <i>Nombre del autor</i>: participó en la revisión y aprobó la versión final.</div>' +
      '<h2 id="g-manuscrito">Preparación del manuscrito</h2>' +
      '<h3>1. Resumen</h3><p>El resumen es la única parte del artículo indexada en muchas bases de datos y la única que leen muchos lectores; debe reflejar con precisión el contenido. <b>No debe mencionar el lugar donde se realizó el estudio.</b> Incluya de 3 a 5 palabras clave (consulte los descriptores MeSH en <a href="https://www.nlm.nih.gov/mesh" target="_blank" rel="noopener">nlm.nih.gov/mesh</a>) y, al final, el Nivel de Evidencia y el Tipo de Estudio según la clasificación del Centre for Evidence-Based Medicine de Oxford (<a href="https://www.cebm.ox.ac.uk" target="_blank" rel="noopener">cebm.ox.ac.uk</a>).</p>' +
      '<ul><li>Artículo original y revisión sistemática: estructurado, máximo 250 palabras: Objetivo, Métodos, Resultados y Conclusión.</li><li>Artículo especial y consejo técnico: sin estructura, máximo 250 palabras.</li><li>Informe de caso: sin estructura, máximo 150 palabras, con objetivo y breve descripción del caso.</li></ul>' +
      '<p>El resumen también se diligencia en la plataforma.</p>' +
      '<h3>2. Cuerpo del manuscrito</h3><p>No debe incluir el lugar donde se realizó el estudio ni ningún dato que identifique a los autores.</p><ul>' +
      '<li><b>Artículo original y revisión sistemática:</b> Introducción, Métodos, Resultados, Discusión, Conclusión y Referencias.</li>' +
      '<li><b>Artículo especial:</b> Introducción, Desarrollo, Conclusión y Referencias.</li>' +
      '<li><b>Informe de caso:</b> breve Introducción, Descripción del caso, Discusión y Referencias.</li>' +
      '<li><b>Consejo técnico:</b> Introducción; Técnica (Métodos), descrita en detalle y con ilustraciones; Discusión (el problema que motivó el procedimiento y por qué es más útil que otros); y Referencias.</li></ul>' +
      '<h3>Estilo y formato</h3><p>Archivo de Word, a doble espacio, en Arial o Times New Roman de 12 puntos, márgenes normales, páginas consecutivas y líneas numeradas de forma continua. No numere las líneas manualmente: use la función del procesador de texto.</p>' +
      '<h3>Tablas</h3><p>Solo para aclarar el texto, sin repetir información, numeradas en el orden en que aparecen. Créelas con la función Tabla de Word, en archivo aparte, a doble espacio y con la misma fuente del texto. No use líneas verticales; use líneas horizontales solo encima y debajo del encabezado y al final de la tabla. Deben tener título breve, ser autoexplicativas y estar citadas en el texto. Se requieren al menos 2 filas.</p>' +
      '<h3>Figuras, imágenes y videos</h3><p>Las ilustraciones (gráficos, dibujos, diagramas de flujo, esquemas, radiografías y resonancias) se citan como figuras en el texto:</p><ul>' +
      '<li>Alta resolución (mínimo 300 ppp), en formato JPEG o PNG.</li><li>En archivos separados del manuscrito (no las incluya en el Word). En esta plataforma se suben en el paso «Imágenes y videos».</li>' +
      '<li>Leyenda clara e independiente del texto, con explicación de las abreviaturas.</li><li>Numeradas con números arábigos en el orden en que aparecen.</li><li>Máximo 12 figuras por artículo.</li>' +
      '<li><b>Videos:</b> MP4, WEBM o MOV de hasta 500 MB cada uno (máximo 6), o un enlace de YouTube o Vimeo. Cítelos como «Video 1».</li></ul>' +
      '<p><b>Permiso para usar figuras y tablas de terceros:</b> los autores son responsables de obtener los permisos. Adjunte la cita completa de la publicación original y la autorización del titular de los derechos de autor.</p>' +
      '<div class="nota">Si las imágenes o videos muestran pacientes, oculte su identidad (rostro, tatuajes, nombres, números de historia clínica) y cuente con su consentimiento informado.</div>' +
      '<h3>Abreviaturas y símbolos</h3><p>Siguiendo las recomendaciones del ICMJE, solo se permiten abreviaturas estandarizadas. La primera vez que aparezca una abreviatura, escriba el término completo seguido de la abreviatura entre paréntesis, salvo las unidades de medida estándar. Evite abreviaturas en el título.</p>' +
      '<h3>Unidades de medida</h3><p>Longitud, altura, peso y volumen en unidades métricas (metros, kilogramos, litros) o sus múltiplos decimales; temperatura en grados Celsius; presión arterial en milímetros de mercurio. Para otras unidades, use el Sistema Internacional de Unidades (SI). Las concentraciones de medicamentos pueden ir en unidades SI o de masa.</p>' +
      '<h3>Otra información</h3><p>Indique siempre el fabricante, la ciudad y el país de origen de los dispositivos y marcas.</p>' +
      '<h3 id="g-citas">Citas en el texto</h3><p>Numéricas y secuenciales, en el orden en que aparecen. Si cita más de dos referencias consecutivas, escriba solo la primera y la última separadas por un guion: <b>(7-11)</b>. Si son alternas, sepárelas con comas: <b>(7,11,16)</b>.</p>' +
      '<h3 id="g-refs">Referencias</h3><p>Estilo <b>Vancouver</b>. Incluya solo los trabajos consultados y citados, numerados según aparecen. Cite hasta seis autores; si hay más, los seis primeros seguidos de «et al.». Abrevie el título de la revista según Medline. Para otros documentos consulte <a href="https://www.icmje.org" target="_blank" rel="noopener">icmje.org</a>.</p>' +
      '<p><b>Artículo de revista</b></p><div class="ejemplo">Attar F, Selvan D, Machin D, Shariff R, Geary NP. Perioperative changes in the microcirculation of the feet after foot and ankle surgery. J Foot Ankle Surg. 2007;46(4):238-41.</div>' +
      '<div class="ejemplo">Reid KS, Martin BD, Duerksen F, Nicolle LE, Garrett M, Simonsen JN, et al. Diabetic foot complications in a northern Canadian Aboriginal community. Foot Ankle Int. 2006;27(12):1065-73.</div>' +
      '<p><b>Institución como autora</b></p><div class="ejemplo">The Foot Society of Australia and New Zealand. Sciatic nerve injury following intramuscular injection: a case report and review of the literature. J Neurosci Nurs. 2006;38(4):238-40.</div>' +
      '<p><b>Sin autor</b></p><div class="ejemplo">Orthopaedics in South Africa [editorial]. S Afr Med J. 1994;84(1):15.</div>' +
      '<p><b>Capítulo de libro</b></p><div class="ejemplo">Mylek WY. Endothelium and its properties. In: Clark BL Jr, editor. New frontiers in surgery. New York: McGraw-Hill; 1998. p. 55-64.</div>' +
      '<p><b>Libro</b></p><div class="ejemplo">Sutton MG St J, Oldershaw PJ, Kotler MN, editors. Textbook of foot and ankle. Cambridge (MA): Blackwell Science; 1996.</div>' +
      '<p><b>Tesis</b></p><div class="ejemplo">Takimura CK. Correlação das variáveis geométricas de lesões do tornozelo com achados ultra-sonográficos [tese]. São Paulo: Universidade de São Paulo; 2003.</div>' +
      '<p><b>Evento</b></p><div class="ejemplo">Silva HH. Pé torto congênito. In: 45º Congresso Brasileiro de Atualização em Cirurgia Ortopédica; 1995; São Paulo. Anais. São Paulo: Associação Brasileira de Medicina e Cirurgia do Tornozelo e Pé; 1995. p. 27-9.</div>' +
      '<p><b>Artículo en internet</b></p><div class="ejemplo">Morse SS. Observations on the fibrous retinacula of the heel pad. Foot Ankle Int [Internet]. 2006 [citado 5 dic 2006];27(8):[aprox. 4 p.]. Disponible en: http://...</div>' +
      '<p><b>Sitio web</b></p><div class="ejemplo">Cancer-Pain.org [Internet]. New York: Association of Cancer Online Resources, Inc.; c2000 [actualizado 16 may 2002; citado 9 jul 2002]. Disponible en: http://www.cancer-pain.org/</div>' +
      '<h3>Agradecimientos</h3><p>Opcionales. Concisos, al final del texto (después de la Conclusión), con las personas o instituciones que contribuyeron a la fase intelectual o técnica y las entidades que financiaron la investigación.</p>' +
      '<h2 id="g-proceso">Proceso de evaluación</h2>' +
      '<p>Cada propuesta es evaluada por el Comité de Investigación de CLEMI y, cuando el tema lo requiera, por evaluadores externos. La aceptación se basa en la originalidad, la relevancia y la contribución a la ciencia. La decisión puede ser: aprobar, solicitar ajustes (sugerencias u observaciones) o denegar. Cuando se piden ajustes, el autor principal los verá en su panel y en su correo, y deberá reenviar el manuscrito corregido dentro del plazo indicado; la nueva versión vuelve a evaluación para confirmar que se atendieron las observaciones.</p>' +
      '<p>En la medida de lo posible, la decisión se tomará en un plazo de <b>120 días</b> desde la recepción. Las propuestas aprobadas se publican en el <b>Archivo</b> de la plataforma y pueden destacarse en <b>Actualidad</b>; antes de la publicación se enviará al autor correspondiente una versión editada para su revisión y aprobación final.</p>' +
      '<h2 id="g-envio">Documentos que debe adjuntar</h2>' +
      '<ul><li><b>Carta de presentación</b> dirigida al Comité de Investigación, que incluya: título del artículo; razón por la que eligió CLEMI; tipo de artículo; nivel de evidencia; número de palabras del título, del resumen y del artículo (sin resumen, tablas, figuras ni referencias); número de tablas, figuras y referencias; y la declaración de que todos los coautores están de acuerdo con el contenido, con la declaración de conflictos de interés y del cumplimiento de las consideraciones éticas.</li>' +
      '<li><b>Página de título</b> con la contribución de los autores.</li><li><b>Declaración de conflicto de intereses.</b></li><li><b>Formulario del Comité de Ética.</b></li>' +
      '<li><b>Manuscrito en Word</b> (incluido el resumen).</li><li><b>Figuras</b> en archivos separados del texto.</li><li><b>Tablas</b> en archivos separados del texto.</li></ul>' +
      '<h3>Plantillas</h3>' + plantillas(true) + tablaDocs(true) +
      '<h2 id="g-chk">Lista de verificación para la presentación</h2>' +
      '<p>Como parte del envío, los autores deben confirmar que su trabajo cumple todos los puntos siguientes. Las propuestas que no se ajusten a estas directrices serán devueltas a los autores.</p>' + listaChk(true);
    },
    en: function () { return '' +
      '<h2 id="g-info">Information</h2>' +
      '<p>On behalf of CLEMI, thank you very much for submitting your work to our Research Platform. To standardize and improve the evaluation of proposals, we have adopted the <b>STROBE Statement</b> and the EQUATOR Network guidelines as a working reference for authors and reviewers. We trust this will bring greater fluency and clarity between the parties, making it easier and faster to evaluate, guide and correct submissions.</p>' +
      '<p>All information about the authors and the department where the study was performed must appear <b>only on the title page</b>. The editorial team will perform a first review and hide any data that could compromise anonymous evaluation. All lines of the text must be numbered consecutively; reviewers will use this numbering to refer to corrections, explaining them clearly, objectively and constructively.</p>' +
      '<p>In your personal panel you will see every comment on each classic section of the work: Title, Abstract, Introduction, Methods, Results, Discussion, Conclusions, Figures and Tables, and References. <b>All reviewers\' questions, without exception, must be answered by the authors.</b></p>' +
      '<p>Corrections incorporated into the new text must be <b>highlighted</b> to make re-reading easier. Corrected texts are resubmitted from the panel for subsequent review rounds, as quickly as possible.</p>' +
      '<div class="nota"><b>How this platform works.</b> Create your personal, non-transferable account, accept this guide, complete the proposal section by section (maximum <b>1,000 words per section</b>), attach images, videos and documents, tick the checklist and submit. You will receive a unique code (e.g., CLEMI-INV-2026-0001) and can follow its status in your panel: <i>Received, Under review, Revisions requested, Approved or Declined</i>.</div>' +
      '<h2 id="g-tipos">Article types and limits</h2>' + tablaTipos(false) +
      '<h3>Publication fee</h3><p>No fee is charged to evaluate or publish articles.</p>' +
      '<h3 id="g-desc">Category descriptions</h3>' +
      '<p><b>Original article.</b> Includes randomized controlled trials, observational studies, registries and basic research with laboratory animals. It must contain: Abstract, Introduction, Methods, Results, Discussion, Conclusions and References (preferably no more than 40).</p>' +
      '<p><b>Case report.</b> Descriptions of patient cases, particular situations, rare or previously undescribed diseases, and innovative diagnostic or treatment methods. It should focus on topics comparable with the literature and not exceed ten references.</p>' +
      '<p><b>Systematic review.</b> The Committee will assess quality and topic relevance. Follow PRISMA and preferably include the PROSPERO registration number.</p>' +
      '<p><b>Technical tip.</b> Offers a suggestion or modification of an existing, documented clinical procedure or application. Completely new procedures are NOT technical tips and must be submitted as original articles.</p>' +
      '<p><b>Special article.</b> Articles outside the previous categories that the Committee considers relevant.</p>' +
      '<p><b>Letter to the editor.</b> Comments on, debates or critiques articles published by CLEMI, or addresses topics of general interest. The reply of the authors concerned may be published with the letter.</p>' +
      '<p><b>Editorial.</b> Topics selected for their relevance, written by the Committee or invited specialists.</p>' +
      '<h2 id="g-listas">Research checklist</h2>' +
      '<p>CLEMI requires compliance with the following reporting guidelines. Upload the completed checklist with your proposal, labeled "Research checklist", indicating the page number next to each item. If your work fits none of them, find the most relevant guideline in the EQUATOR Network (<a href="https://www.equator-network.org" target="_blank" rel="noopener">www.equator-network.org</a>) or explain why in the cover letter.</p>' +
      '<ul><li><b>CONSORT</b>: randomized controlled trials and experimental studies.</li><li><b>PRISMA</b>: systematic reviews.</li><li><b>CHEERS</b>: economic evaluations.</li><li><b>STARD</b>: diagnostic research.</li><li><b>STROBE</b>: observational studies.</li><li><b>MOOSE</b>: meta-analyses of observational studies.</li><li><b>GRRAS</b>: reliability and agreement studies.</li><li><b>BRISQ</b>: biospecimen reporting.</li><li><b>CARE</b>: case reports.</li></ul>' +
      '<h2 id="g-titulo">Title page</h2><p>Submitted as a separate file, including:</p><ul>' +
      '<li>The title: concise and informative, without acronyms or abbreviations, maximum 12 words (excluding articles and prepositions).</li>' +
      '<li>Full names, without abbreviations, of all authors and co-authors, with full institutional affiliation (institution; city; state or department; country), address and postal code, mobile phone and email.</li>' +
      '<li>ORCID number (<a href="https://orcid.org" target="_blank" rel="noopener">orcid.org</a>) of the author and all co-authors.</li>' +
      '<li>Where the study was performed.</li>' +
      '<li>If presented at a meeting or congress: official name, place and date.</li>' +
      '<li>If part of a thesis or dissertation: institution and date of defense.</li>' +
      '<li>"Authors\' contribution". Each author must meet at least two criteria: (a) conceived or planned the activities that led to the article, or interpreted the results, or both; (b) wrote the article or reviewed successive versions and took part in the revision; (c) approved the final version.</li></ul>' +
      '<div class="ejemplo"><b>Example.</b> Each author contributed personally and significantly to this article: <i>Author name</i>: conceived and planned the activities that led to the study, wrote the article, took part in the review and approved the final version; <i>Author name</i>: interpreted the results and took part in the review; <i>Author name</i>: took part in the review and approved the final version.</div>' +
      '<h2 id="g-manuscrito">Manuscript preparation</h2>' +
      '<h3>1. Abstract</h3><p>The abstract is the only part of the article indexed in many databases and the only part many readers consult; it must reflect the content accurately. <b>It must not mention where the study was conducted.</b> Include 3 to 5 keywords (see MeSH at <a href="https://www.nlm.nih.gov/mesh" target="_blank" rel="noopener">nlm.nih.gov/mesh</a>) and, at the end, the Level of Evidence and Type of Study according to the Oxford Centre for Evidence-Based Medicine (<a href="https://www.cebm.ox.ac.uk" target="_blank" rel="noopener">cebm.ox.ac.uk</a>).</p>' +

      '<h3>Figures, images and videos</h3><p>Illustrations (graphs, drawings, flowcharts, diagrams, radiographs and MRIs) are cited as figures in the text:</p><ul>' +
      '<li>High resolution (minimum 300 dpi), JPEG or PNG format.</li><li>In files separate from the manuscript (do not embed them in Word). On this platform they are uploaded in the "Images and videos" step.</li>' +

      '<h3>Units of measurement</h3><p>Length, height, weight and volume in metric units (meters, kilograms, liters) or decimal multiples; temperature in degrees Celsius; blood pressure in millimeters of mercury. For other units, use the International System of Units (SI). Drug concentrations may be given in SI or mass units.</p>' +

      '<div class="ejemplo">Reid KS, Martin BD, Duerksen F, Nicolle LE, Garrett M, Simonsen JN, et al. Diabetic foot complications in a northern Canadian Aboriginal community. Foot Ankle Int. 2006;27(12):1065-73.</div>' +

    coautores: [{ nombre: 'Jorge Iván Salcedo Paz', afiliacion: 'Hospital Ángeles Lomas, Ciudad de México, México', correo: '', orcid: '', contribucion: 'Interpretó los resultados y aprobó la versión final.' }, { nombre: 'Daniela Torres Uribe', afiliacion: 'Universidad Nacional Autónoma de México, México', correo: '', orcid: '', contribucion: 'Análisis estadístico.' }],
    secciones: {
      introduccion: 'La artrodesis subtalar es el tratamiento de elección para la artrosis subtalar sintomática y las secuelas de fracturas de calcáneo (1-3). La fijación con uno o dos tornillos canulados es la técnica más difundida, aunque la placa bloqueada se ha propuesto como alternativa en hueso de mala calidad (4,5).\n\nEl objetivo de este estudio fue comparar la consolidación, la función y las complicaciones de ambas técnicas.',
      metodos: 'El estudio fue aprobado por el Comité de Ética e Investigación institucional (acta 112-2024). Se revisaron 84 pacientes consecutivos operados entre 2019 y 2024: 46 con tornillos canulados de 6,5 mm y 38 con placa bloqueada. Se excluyeron pacientes con seguimiento menor de 12 meses.\n\nLa consolidación se definió como puentes trabeculares en más del 50 % de la superficie articular en la tomografía a los 6 meses (Figura 1). La función se midió con la escala AOFAS.',
      resultados: 'La edad media fue de 52 años. La consolidación fue del 92 % en el grupo de tornillos y del 95 % en el grupo de placa (p = 0,48). La AOFAS mejoró de 41 a 82 puntos en promedio, sin diferencias entre grupos (Tabla 1).\n\nSe retiró el material en el 4 % de los tornillos y en el 18 % de las placas, por prominencia lateral (Figura 2).',
      discusion: 'Nuestros resultados coinciden con series previas que reportan tasas de consolidación superiores al 90 % con ambas técnicas (2,6). La mayor tasa de retiro de material con placa concuerda con lo descrito por otros autores (5).\n\nLas limitaciones son el diseño retrospectivo y el tamaño de la muestra.',

  function seguimiento(p) {
